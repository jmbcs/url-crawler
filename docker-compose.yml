services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawler}
      POSTGRES_DB: ${POSTGRES_DB:-crawler}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crawler} -d ${POSTGRES_DB:-crawler}"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro

  migrate:
    build:
      context: .
      target: service
    command: ["alembic", "upgrade", "head"]
    env_file: &env_file
      - path: .env
        required: false
    environment: &env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-crawler}:${POSTGRES_PASSWORD:-crawler}@postgres:5432/${POSTGRES_DB:-crawler}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: service
    command: ["url-crawler-api"]
    restart: unless-stopped
    env_file: *env_file
    environment: *env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: service
    command: ["url-crawler-worker"]
    restart: unless-stopped
    env_file: *env_file
    environment: *env
    mem_limit: 1g
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
