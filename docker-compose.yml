services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler -d crawler"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: service
    command: ["alembic", "upgrade", "head"]
    environment: &env
      DATABASE_URL: postgresql+asyncpg://crawler:crawler@postgres:5432/crawler
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: service
    command: ["url-crawler-api"]
    restart: unless-stopped
    environment: *env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: service
    command: ["url-crawler-worker"]
    restart: unless-stopped
    environment: *env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
